name: Lint Code Base
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: NPM install
        run: npm install
      - name: Run Prettier
        run: npm run format:check
      - name: Run ESlint
        run: npm run lint
